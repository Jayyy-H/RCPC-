data:
  #train_files: /mnt/bn/chenhaobo-va-data/lrj/data/flywheel_runs/test/final_clean.jsonl
  train_files: /mnt/bn/chenhaobo-va-data/lrj/data/train_ropd/t3f4/gpt5.4_4800.jsonl
  val_files: /mnt/bn/chenhaobo-va-data/lrj/data/train_ropd/train_sft/gpt5.4_4600.jsonl
  prompt_key: problem
  target_key: solution
  max_prompt_length: 4096
  max_response_length: 1024
  rollout_batch_size: 32
  shuffle: true
  seed: 1
  max_pixels: 200704
  min_pixels: 78400

algorithm:
  adv_estimator: grpo
  kl_coef: 0.0
  rl_paradigm: sft+rl

worker:
  actor:
    global_batch_size: 32
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 4
    max_grad_norm: 1.0
    use_kl_loss: false
    kl_loss_coef: 0
    kl_loss_type: low_var_kl
    sft_coef: 1
    sft_coef_decay_step: 40
    sft_coef_decay_rate: 0.1
    model:
      #model_path: /mnt/bn/yangmin-priv/czh/checkpoints/valley/valleylite_ecom_vl_7B_Gthinker_omni_data_v121_150k_opensourse_150k/
      #model_path: /mnt/bn/chenhaobo-va-data/lrj/checkpoints/valleylite-7b-ipr-cot-sft-0524/final/
      model_path: /mnt/bn/chenhaobo-va-data/lrj/checkpoints/valleylite-7b-ipr-cot-sft-0607/checkpoint-20/
      enable_gradient_checkpointing: true
      trust_remote_code: false
      attn_implementation: flash_attention_2
      #attn_implementation: sdpa
    optim:
      lr: 5.0e-6
      weight_decay: 1.0e-2
    fsdp:
      enable_full_shard: false
      param_offload: false
      optimizer_offload: true
      torch_dtype: bf16
    offload:
      param_offload: true
      optimizer_offload: true

  rollout:
    name: "vllm"
    temperature: 1.0
    seed: 0
    forced_response_prefix: "<think>\n"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.6
    n: 8
    limit_images: 16
    max_image_num: 16
    mm_processor_cache_gb: 0
    disable_mm_preprocessor_cache: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 8192

  ref:
    offload:
      param_offload: true

  reward:
    reward_type: function
    compute_score: ropd_ipr
    num_examine: 10
    ropd_model: gpt-5.4-2026-03-05
    ropd_api_style: responses
    ropd_api_key_env: GPT5_4_API_KEY
    ropd_base_url_env: GPT5_4_BASE_URL
    ropd_teacher_answer_count: 3
    ropd_max_concurrency: 4
    ropd_request_timeout: 120.0
    ropd_include_ground_truth: true
    ropd_include_images: true
    ropd_filter_teacher_by_answer: true
    ropd_print_teacher_outputs: true
    ropd_print_student_outputs: true
    ropd_print_rubric_outputs: true
    ropd_print_verifier_outputs: true
    ropd_require_strict_cot_format: true
    ropd_final_label_points_cap: 5
    ropd_format_points_cap: 1
    ropd_fallback_to_ipr: true
    ropd_score_offpolicy: false
    ropd_use_criterion_advantage: true
    # Shadow attribution is logged for inspection only and does not affect gradients.
    ropd_shadow_attribution_enabled: true
    ropd_shadow_attribution_max_groups_per_batch: 1
    ropd_shadow_attribution_max_output_tokens: 4096
    ropd_print_shadow_attributions: true
    ropd_debug_path: outputs/ropd_reward_f4t3_fromsft20_debug.jsonl

trainer:
  total_episodes: 40
  logger: ["console", "wandb"]
  project_name: ipr-audigpt
  experiment_name: valleylite-ROPD-f4t3-v1-fromsft20
  n_gpus_per_node: 8
  nnodes: 1
  save_freq: 10
  test_freq: 10
  val_before_train: true
  val_only: false
  save_checkpoint_path: /mnt/bn/chenhaobo-va-data/lrj/ecom-test/ecom-test/checkpoints/valleylite-ROPD-f4t3-v1-fromsft20/
  load_checkpoint_path: null
  save_ckpt_limit: 20
  save_shard_limit: 10
  val_generations_to_log_to_wandb: 20
